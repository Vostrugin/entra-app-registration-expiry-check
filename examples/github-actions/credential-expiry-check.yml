# Daily check for expired and expiring App Registration secrets and certificates.
# Copy this file to .github/workflows/ in the repository that holds the scripts and src folders.
# Setup: examples/github-actions/README.md

name: Credential expiry check

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day
  workflow_dispatch:

permissions:
  id-token: write # lets azure/login exchange the workflow's OIDC token
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install the Microsoft Graph authentication module
        shell: pwsh
        run: Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Force

      - name: Check credentials
        shell: pwsh
        run: |
          $token = az account get-access-token --resource-type ms-graph --query accessToken -o tsv |
              ConvertTo-SecureString -AsPlainText -Force
          ./scripts/Invoke-ExpiryCheck.ps1 -AccessToken $token -ThresholdDays 30 -OutputPath ./report

      - name: Add the findings to the run summary
        if: always()
        shell: pwsh
        run: |
          $path = './report/credential-expiry.json'
          if (-not (Test-Path $path)) {
              'The check did not produce a report. The "Check credentials" step has the error.' >> $env:GITHUB_STEP_SUMMARY
              exit 0
          }

          $report = Get-Content $path -Raw | ConvertFrom-Json
          $s = $report.summary
          $lines = @(
              '### App Registration credentials'
              ''
              "Expired: $($s.expired) | Expiring: $($s.expiring) | Healthy: $($s.healthy) | Excluded: $($s.excluded)"
              ''
          )

          $attention = @($report.credentials | Where-Object { -not $_.excluded -and $_.status -in 'Expired', 'Expiring' })
          if ($attention.Count -gt 0) {
              $lines += '| Status | Days | App | Type | Name | Expires (UTC) |'
              $lines += '| --- | ---: | --- | --- | --- | --- |'
              foreach ($c in $attention) {
                  $end = ([datetime]$c.endDateTime).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
                  $lines += "| $($c.status) | $($c.daysRemaining) | $($c.appDisplayName) | $($c.credentialType) | $($c.credentialName) | $end |"
              }
          }

          $lines -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-expiry-report
          path: report/
          if-no-files-found: ignore
          retention-days: 30
